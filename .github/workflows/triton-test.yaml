name: V4.1 record GPU qualification
on:
  workflow_dispatch:
    inputs:
      report:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  records:
    name: MI355X record readers
    runs-on: v41-records-c910e55-mi355x
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c910e55c7bcac9f6724dfd4e3101749d04cc06e3
          persist-credentials: false
      - name: Check tested revision
        run: |
          test "$(git rev-parse HEAD)" = c910e55c7bcac9f6724dfd4e3101749d04cc06e3
          git rev-parse HEAD | tee tested-sha.txt
      - name: Run readers and legacy regression on one MI355X
        run: |
          set -euo pipefail
          mkdir -p test-reports
          docker run --rm --name "v41-record-ci-${GITHUB_RUN_ID}" \
            --device /dev/kfd --device /dev/dri --ipc host \
            --ulimit memlock=-1 --ulimit stack=67108864 \
            --security-opt seccomp=unconfined \
            -e HIP_VISIBLE_DEVICES=6 -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD:/workspace:ro" -v "$PWD/test-reports:/reports" \
            --entrypoint bash \
            vllm/vllm-openai-rocm:nightly-rocm100-3966924d566340e971a6da313e790d05492aa505 \
            -c '
              set -euo pipefail
              cd /tmp
              uv venv --system-site-packages --python /usr/bin/python3.12 .venv
              cp -r /workspace/aiter/ops/triton/. /usr/local/lib/python3.12/dist-packages/aiter/ops/triton/
              mkdir -p /tmp/t
              cp -r /workspace/op_tests /tmp/t/
              cd /tmp/t
              /tmp/.venv/bin/python -c "import torch; print(torch.cuda.get_device_name(0)); print(torch.cuda.get_device_properties(0).gcnArchName)"
              /tmp/.venv/bin/python -m pytest -q -p no:cacheprovider op_tests/triton_tests/attention/test_pa_decode_sparse.py -k v41_record -x --junitxml=/reports/v41.xml
              /tmp/.venv/bin/python -m pytest -q -p no:cacheprovider op_tests/triton_tests/attention/test_pa_decode_sparse.py -k "with_extra and fp8 and not strided and (T1- or T32- or 128-)" --junitxml=/reports/legacy.xml
              /tmp/.venv/bin/python -m pytest -q -p no:cacheprovider op_tests/triton_tests/attention/test_sparse_mla.py -x --junitxml=/reports/sparse.xml
            '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mi355x-record-qualification
          path: |
            tested-sha.txt
            test-reports/
